[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbtmutant"
version = "0.1.0"
description = "Mutation testing for dbt projects: plant plausible bugs in each model and report the ones your tests miss."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "dbtmutant contributors" }]
keywords = ["dbt", "mutation-testing", "sqlglot", "duckdb", "data-quality"]
dependencies = [
    "sqlglot>=30,<31",
    "dbt-core>=1.10.5,<2",
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.1,<3",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dbtmutant = "dbtmutant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtmutant"]

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
